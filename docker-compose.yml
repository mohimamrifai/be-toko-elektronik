services:
  postgres:
    image: postgres:17-alpine
    container_name: toko-elektronik-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toko_elektronik
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d toko_elektronik']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
